num_callback_threads:                       4
postprocessor_num_threads:                  4

# Robot.
map_frame_id:                               odom
robot_base_frame_id:                        base_link
robot_pose_with_covariance_topic:           /elevation_mapping/pose
robot_pose_cache_size:                      200
input_sources:
  front: # A name to identify the input source
    type: pointcloud # Supported types: pointcloud
    topic: /front_camera/depth_registered/points_downsampled
    queue_size: 1
    publish_on_update: true # Wheter to publish the elevation map after a callback from this source.
    sensor_processor:
      type: perfect
track_point_frame_id:                       base_link
track_point_x:                              0.0
track_point_y:                              0.0
track_point_z:                              0.0
min_update_rate:                            5.0
time_tolerance:                             1.0
time_offset_for_point_cloud:                0.0
sensor_processor/ignore_points_above:       1.0
sensor_processor/ignore_points_below:       -0.5
robot_motion_map_update/covariance_scale:   0.01

# Map.
length_in_x:                                6.0
length_in_y:                                6.0
position_x:                                 0.0
position_y:                                 0.0
resolution:                                 0.05
min_variance:                               0.0001
max_variance:                               0.05
mahalanobis_distance_threshold:             2.5
multi_height_noise:                         0.001
surface_normal_positive_axis:               z
fused_map_publishing_rate:                  10.0
enable_visibility_cleanup:                  false
visibility_cleanup_rate:                    1.0
scanning_duration:                          0.033

# Init submap
initialize_elevation_map:                   false
initialization_method:                      0
length_in_x_init_submap:                    1.6
length_in_y_init_submap:                    1.6
init_submap_height_offset:                  0.01
init_submap_variance:                       0.001
target_frame_init_submap:                   base_link
