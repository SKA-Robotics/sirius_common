# Footprint parameters
footprint:
  footprint_polygon: [[0.22, 0.15], [0.22, -0.15], [-0.22, -0.15], [-0.22, 0.15]] # Vertices of footprint polygon with coordinates [x, y] in robot footprint frame.
  circular_footprint_radius: 0.26
  circular_footprint_radius_inscribed: 0.2
  circular_footprint_offset: 0.075
  footprint_frame_id: base_link
  traversability_default: 0.3
  verify_roughness_footprint: true
  check_robot_inclination: false
