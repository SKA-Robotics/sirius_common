# ArUco detection parameters
aruco_params:
  dictionary_id: "DICT_6X6_250"  # ArUco dictionary to use
  marker_size: 0.05  # Size of ArUco markers in meters
  max_marker_distance: 5.0  # Maximum distance to detect markers (meters)
  confidence_threshold: 0.7  # Minimum confidence for detection
  averaging_window: 10  # Number of detections to average for position smoothing

# Node parameters
node_params:
  publish_rate: 30.0  # Hz
  image_width: 1280
  image_height: 720
  connection_timeout: 5.0  # seconds
  reconnect_interval: 10.0  # seconds
