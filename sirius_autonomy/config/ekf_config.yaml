frequency: 30
sensor_timeout: 0.1

two_d_mode: false
publish_tf: true
map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

odom0: /robot_localization/odometry
odom0_config: [true, true, false,  false, false, true,   false, false, false,  false, false, true,   false, false, false]
# x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw
# Use x, y, yaw from robot_localization node

odom1: /slam/odometry
# Use z, roll, pitch from visual odometry, and all velocities
odom1_config: [false, false, true,  true, true, false,   true, true, true,  true, true, true,   false, false, false]
# Use z, roll, pitch from visual odometry

# x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw
# Now also using vx, vy, vz, vroll, vpitch, vyaw from visual odometry

use_control: false
