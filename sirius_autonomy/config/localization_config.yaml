# Robot Localization Configuration
# This file defines the coordinate system and known marker positions

# GPS Coordinate System Definition
# Origin point (0,0) in virtual coordinate system
origin_lat: 52.2297  # Example: Warsaw, Poland latitude
origin_lon: 21.0122  # Example: Warsaw, Poland longitude

# Reference point to define coordinate system orientation and scale
# This point will be mapped to the specified virtual coordinates
reference_lat: 52.2307  # Example: 100m north of origin
reference_lon: 21.0122  # Same longitude as origin
reference_virtual_x: 100.0  # 100 meters in virtual X direction
reference_virtual_y: 0.0    # 0 meters in virtual Y direction

# Known ArUco marker positions in virtual coordinate system
# Format: marker_id: [x, y, z] in meters
known_markers:
  # Example markers in a 10m x 10m area
  '0': [5.0, 5.0, 0.0]    # Marker 0 at (5, 5, 0)
  '1': [5.0, -5.0, 0.0]   # Marker 1 at (5, -5, 0)
  '2': [-5.0, 5.0, 0.0]   # Marker 2 at (-5, 5, 0)
  '3': [-5.0, -5.0, 0.0]  # Marker 3 at (-5, -5, 0)
  '4': [10.0, 0.0, 0.0]   # Marker 4 at (10, 0, 0)
  '5': [-10.0, 0.0, 0.0]  # Marker 5 at (-10, 0, 0)
  '6': [0.0, 10.0, 0.0]   # Marker 6 at (0, 10, 0)
  '7': [0.0, -10.0, 0.0]  # Marker 7 at (0, -10, 0)

# Node parameters
node_params:
  pose_estimation_rate: 10.0  # Hz
  gps_timeout: 1.0            # seconds
  marker_timeout: 0.5         # seconds
  min_markers_for_orientation: 1  # minimum markers needed for orientation estimation
